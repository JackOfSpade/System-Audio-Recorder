name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift build and tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Swift version
        run: swift --version
      - name: Build debug configuration
        run: swift build
      - name: Run tests
        run: swift test
      - name: Build release configuration
        run: swift build -c release

      - name: Assemble and verify the ad-hoc signed app package
        run: bash Scripts/check-package.sh
      - name: Retain verified app package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: System-Audio-Recorder-macOS-${{ github.sha }}
          path: build/ci-artifacts/*.zip
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI required
    if: ${{ always() }}
    needs: ["test", "merge-policy"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required jobs did not succeed: {failed}")
          PY

  merge-policy:
    name: Validate merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/tests -p 'test_merge_validated_pr.py'
